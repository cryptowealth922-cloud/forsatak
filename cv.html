<!doctype html><html lang="ar" dir="rtl"><head><title>السيرة الذاتية | فرصتك</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#081321"><style>
:root{--bg:#081321;--panel:#102137;--gold:#dfc486;--text:#f8f5ed;--muted:#aebdcd;--line:#2a4057}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0%,#1a3047,transparent 45%),var(--bg);color:var(--text);font:16px/1.8 Tahoma,Arial,sans-serif}a{color:inherit}button,input,select,textarea{font:inherit}.wrap{width:min(1080px,calc(100% - 32px));margin:auto}.head{position:sticky;top:0;background:#081321ed;border-bottom:1px solid #ffffff1c;z-index:5}.nav{min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}.logo{font-weight:900;font-size:1.35rem;color:var(--gold);text-decoration:none}.links{display:flex;gap:16px;flex-wrap:wrap}.links a{text-decoration:none;color:#d7deE5}.links a:hover{color:var(--gold)}main{padding:38px 0 70px}.eyebrow{color:var(--gold);font-weight:bold}.hero{padding:30px 0 26px}.hero h1{font-size:clamp(2rem,5vw,3.5rem);line-height:1.3;margin:8px 0}.hero p,.muted{color:var(--muted)}.panel{background:linear-gradient(145deg,#13253a,#0d1a2a);border:1px solid var(--line);border-radius:20px;padding:clamp(17px,3vw,28px);margin:18px 0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;min-width:0}.field input,.field select,.field textarea{width:100%;min-width:0;background:#081321;color:var(--text);border:1px solid #354a61;border-radius:11px;padding:11px;font-size:16px}.btn{border:1px solid var(--gold);border-radius:12px;padding:10px 17px;background:var(--gold);color:#111a26;font-weight:bold;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;margin:4px}.btn.alt{background:transparent;color:var(--text);border-color:#43566b}.result{white-space:pre-wrap;overflow-wrap:anywhere;background:#07111e;border:1px solid #30445b;padding:15px;border-radius:12px;margin-top:14px}.card{border:1px solid var(--line);background:#102137;border-radius:16px;padding:18px}.card h3{margin-top:0}.footer{border-top:1px solid #ffffff18;color:var(--muted);padding:25px 0;font-size:.9rem}@media(max-width:700px){.grid{grid-template-columns:1fr}.nav{padding:12px 0}.links{gap:10px 14px}}
</style></head><body><header class="head"><div class="wrap nav"><a class="logo" href="./index.html">◈ فرصتك <small style="font-size:.65rem;letter-spacing:.12em">F O R S A T A K</small></a><nav class="links"><a href="./index.html">الرئيسية</a><a href="./egypt.html">وظائف مصر</a><a href="./international.html">وظائف الخارج</a><a href="./tools.html">الأدوات المهنية</a></nav></div></header><main class="wrap"><div class="hero"><span class="eyebrow">ملفك المهني</span><h1>أنشئ مسودة سيرتك الذاتية</h1><p class="muted">تُنشأ داخل المتصفح فقط. اكتب الاسم والوظيفة المستهدفة لإنشاء مسودة، ثم انسخها أو احفظها كملف نصي.</p><section class="panel"><div class="grid"><label class="field">الاسم بالكامل<input id="name" autocomplete="name"></label><label class="field">الوظيفة المستهدفة<input id="target"></label><label class="field">وسيلة التواصل<input id="contact" placeholder="بريد إلكتروني أو هاتف"></label><label class="field">المدينة<input id="city"></label><label class="field">التعليم<input id="education"></label><label class="field">المهارات<input id="skills" placeholder="افصل بين المهارات بفواصل"></label></div><label class="field">الخبرة أو المشاريع<textarea id="experience" rows="3"></textarea></label><label class="field">نبذة مهنية<textarea id="summary" rows="3"></textarea></label><button class="btn" id="make">إنشاء المسودة</button><button class="btn alt" id="copy">نسخ</button><button class="btn alt" id="download">حفظ TXT</button><button class="btn alt" id="clear">مسح</button><div id="result" class="result" hidden></div></section></div></main><footer class="footer"><div class="wrap">فرصتك — اكتشف، افهم، استعد وقدّم. راجع الإعلان الأصلي وشروطه قبل مشاركة بياناتك.</div></footer><script>
let draft='';const $=id=>document.getElementById(id);$('make').onclick=()=>{if(!$('name').value.trim()||!$('target').value.trim()){$('result').hidden=false;$('result').textContent='اكتب الاسم والوظيفة المستهدفة أولًا.';return}draft=[$('name').value.trim(),$('target').value.trim(),'',$('contact').value,$('city').value,'','نبذة مهنية',$('summary').value,'','التعليم',$('education').value,'','المهارات',$('skills').value,'','الخبرة والمشاريع',$('experience').value].join('\n');$('result').hidden=false;$('result').textContent=draft};
$('copy').onclick=async()=>{if(!draft){$('result').hidden=false;$('result').textContent='أنشئ المسودة أولًا.';return}try{await navigator.clipboard.writeText(draft);$('result').textContent='تم نسخ المسودة.';$('result').hidden=false}catch(e){$('result').textContent=draft+'\n\nحدد النص وانسخه يدويًا.';$('result').hidden=false}};
$('download').onclick=()=>{if(!draft){$('result').hidden=false;$('result').textContent='أنشئ المسودة أولًا.';return}const u=URL.createObjectURL(new Blob(['\ufeff',draft],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download='Forsatak-CV.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
$('clear').onclick=()=>{document.querySelectorAll('input,textarea').forEach(x=>x.value='');draft='';$('result').hidden=true;$('result').textContent=''};
</script></body></html>
